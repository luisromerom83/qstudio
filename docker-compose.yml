# ==============================================================================
# Quadient Inspire Flex - Demo & PoC Studio Manager Orchestrator
# ==============================================================================
# Ejecución:
#   docker compose up -d
#
# Acceso:
#   http://localhost:8090
# ==============================================================================
services:
  studio-manager:
    image: luisromerom/inspire-flex-demo-studio:latest
    container_name: inspire-studio-manager
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      # Idioma por defecto de la interfaz: es-MX, en-US o pt-BR.
      # Cada usuario puede cambiarlo desde el selector; vacío = idioma del navegador.
      - STUDIO_LANG=${STUDIO_LANG:-}
    security_opt:
      - label=disable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - studio_data:/app/manager/data
      - studio_environments:/app/manager/environments
      - studio_docker_config:/root/.docker

volumes:
  studio_data:
    name: studio_data
  studio_environments:
    name: studio_environments
  studio_docker_config:
    name: studio_docker_config
