services:
  # ----------------------------------------------------------------------------
  # 1. Apache Kafka en modo KRaft (Sin Zookeeper)
  # ----------------------------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: kafka-standalone
    restart: unless-stopped
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # IMPORTANTE: EXTERNAL debe anunciar la IP alcanzable desde la VM externa de Scaler
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  # ----------------------------------------------------------------------------
  # 2. Inicializador de Topics automático (One-Shot)
  # ----------------------------------------------------------------------------
  kafka-init-topics:
    image: apache/kafka:latest
    container_name: kafka-init-topics
    restart: "no"
    depends_on:
      - kafka
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "[*] Esperando a que el broker Kafka esté disponible..."
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list &>/dev/null; do
          sleep 2
        done
        echo "[*] Creando topic predeterminado: ${KAFKA_TOPIC:-sensor-data}..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "${KAFKA_TOPIC:-sensor-data}" --partitions 1 --replication-factor 1
        echo "[✓] Topics activos en el cluster:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list

volumes:
  kafka_data:
