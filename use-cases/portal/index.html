<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="portal.pageTitle">Casos de Uso</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div class="page-header-row">
        <h1><span class="brand-icon" aria-hidden="true"></span><span data-i18n="portal.title">Casos de uso</span></h1>
        <div id="lang-slot"></div>
      </div>
      <p data-i18n="portal.intro">Aplicaciones demo de este ambiente de Inspire Flex. Cada una simula el sistema del cliente que genera o recibe las comunicaciones.</p>
    </header>

    <section id="cases" class="cases" aria-live="polite">
      <p class="empty" data-i18n="portal.loading">Cargando casos de uso…</p>
    </section>
  </main>

  <script src="i18n/es-MX.js"></script>
  <script src="i18n/en-US.js"></script>
  <script src="i18n/pt-BR.js"></script>
  <script src="/shared/i18n.js"></script>
  <script>
    const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

    // Each case opens in the portal's language
    const caseHref = (path) => `${path}?lang=${encodeURIComponent(currentLang)}`;

    function renderLangSelect() {
      document.getElementById('lang-slot').innerHTML = langSelectHtml('lang-select');
      applyI18n(document.getElementById('lang-slot'));
    }

    async function loadCases() {
      const container = document.getElementById('cases');
      try {
        // Names, descriptions and status come back in the interface language
        const res = await fetch('api/cases');
        const cases = await res.json();
        if (!cases.length) {
          container.innerHTML = `<p class="empty">${escapeHtml(t('portal.empty'))}</p>`;
          return;
        }
        container.innerHTML = cases.map(c => `
          <a class="case" href="${escapeHtml(caseHref(c.path))}">
            <span class="case-icon" aria-hidden="true">${escapeHtml(c.icon || '📄')}</span>
            <span class="case-body">
              <span class="case-name">${escapeHtml(c.name)}</span>
              <span class="case-desc">${escapeHtml(c.description)}</span>
              <span class="case-status ${c.status && c.status.ready ? 'ok' : 'warn'}">${escapeHtml((c.status && c.status.message) || t('portal.ready'))}</span>
            </span>
            <span class="case-path">${escapeHtml(c.path)}</span>
          </a>`).join('');
      } catch (err) {
        container.innerHTML = `<p class="empty">${escapeHtml(t('portal.loadError', { error: err.message }))}</p>`;
      }
    }

    window.addEventListener('studio:languagechange', () => {
      renderLangSelect();
      loadCases();
    });

    renderLangSelect();
    loadCases();
  </script>
</body>
</html>
