<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Digital Advantage Inbox stylesheet -->
  <link href="css/styles.css" rel="stylesheet">
  <!-- Logo and colors of this environment, from Studio Manager -->
  <script src="/branding.js"></script>

  <!-- CLOUD_URL / CLOUD_APP_ID / CLOUD_CLIENT_ID for the SDK and this demo's document, from the Studio Manager settings -->
  <script src="js/runtime-config.js"></script>
  <script src="vendor/web-runtime.js"></script>
</head>
<body>

  <nav class="navbar navbar-app sticky-top py-2">
    <div class="container-fluid px-3 px-lg-4">
      <span class="navbar-brand d-flex align-items-center gap-2 fw-bold">
        <span class="brand-mark" data-brand-logo><i class="bi bi-file-earmark-richtext"></i></span>
        <span id="demo-name"></span>
      </span>
      <div class="d-flex align-items-center gap-2 ms-auto">
        <div id="lang-select-slot"></div>
      </div>
    </div>
  </nav>

  <main>
    <section id="view-loading" class="view text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
    </section>

    <section id="view-error" class="view d-none">
      <div class="container narrow py-5">
        <div class="alert alert-danger">
          <h2 id="error-title" class="h6 fw-bold mb-1"></h2>
          <p id="error-body" class="small mb-0"></p>
        </div>
        <button id="btn-retry" type="button" class="btn btn-primary w-100" data-i18n="demo.retry">Reintentar</button>
      </div>
    </section>

    <section id="view-document" class="view d-none">
      <iframe id="doc-frame" title="Documento" data-i18n-attr="title:demo.frameTitle"
        sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox"></iframe>
    </section>
  </main>

  <script src="i18n/es-MX.js"></script>
  <script src="i18n/en-US.js"></script>
  <script src="i18n/pt-BR.js"></script>
  <script src="/shared/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
